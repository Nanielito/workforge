[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workforge"
version = "2.3.0"
description = "Turn work inputs into provider-neutral requirements and planning items."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pytest>=8.3.0",
]

[project.scripts]
workforge = "workforge.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
